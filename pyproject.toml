[project]
name = "learning-langchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zhangzhenhua", email = "zzhua095@foxmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx2[socks]>=2.16.0",
    "notebook>=7.6.3",
    "openai>=3.41.0",
